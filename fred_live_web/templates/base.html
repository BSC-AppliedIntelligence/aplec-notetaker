<!doctype html>
<html lang="{{ ui_lang() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Fred{% endblock %} · Fred Notetaker</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/flags.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/localtime.js" defer></script>
</head>
<body>
  {% block nav %}
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/" aria-label="{{ t('Fred Notetaker home') }}">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#g)"/>
          <path d="M9 20.5c2-1 3-4.5 3.5-8M12.5 12.5c4.5-.5 7-.5 10.5 0M12 16.5c3.5-.4 5.5-.4 8.5 0"
                stroke="#171310" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="32" y2="32">
              <stop stop-color="#F6BC55"/><stop offset="1" stop-color="#DE8F26"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="brand-name">Fred<span class="brand-dim"> Notetaker</span></span>
      </a>
      <nav class="nav-actions">
        {% if user %}
        {% if user.is_admin %}
        <a class="ghost-btn" href="/admin/users">{{ t("Users") }}</a>
        <a class="ghost-btn" href="/admin/voiceprints">{{ t("Voiceprints") }}</a>
        {% endif %}
        <a class="ghost-btn" href="/settings">
          <svg class="icon-s" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M4.5 12H2M22 12h-2.5M5.4 5.4l1.8 1.8M16.8 16.8l1.8 1.8M5.4 18.6l1.8-1.8M16.8 7.2l1.8-1.8"/></svg>
          {{ t("Settings") }}
        </a>
        <div class="user-chip" title="{{ user.email }}">
          <span class="avatar" style="--hue: {{ speaker_hue(user.name) }}">{{ initials(user.name) }}</span>
          <span class="user-name">{{ user.name }}</span>
        </div>
        <form method="post" action="/logout">
          <button class="ghost-btn" type="submit">{{ t("Sign out") }}</button>
        </form>
        {% endif %}
      </nav>
    </div>
  </header>
  {% endblock %}

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
